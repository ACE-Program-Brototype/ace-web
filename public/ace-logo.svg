<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Depth shadow gradient for right vertical bar matching original logo -->
    <linearGradient id="rightBarShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#164AE8"/>
      <stop offset="100%" stop-color="#0E2C8E"/>
    </linearGradient>
  </defs>

  <!-- Curved Favicon Background (Smooth Squircle - Not Square!) -->
  <rect width="512" height="512" rx="112" fill="#030304"/>

  <g transform="translate(17, 10)">
    <!-- ==========================================
         1. TOP & BOTTOM FLOATING BLUE ACCENT BARS
         ========================================== -->
    <!-- Top Horizontal Blue Bar (floating above C and E) -->
    <rect x="211" y="88" width="194" height="22" rx="2" fill="#154DF4"/>

    <!-- Bottom Horizontal Blue Bar (extending under C and E to outer frame) -->
    <rect x="211" y="270" width="220" height="22" rx="2" fill="#154DF4"/>

    <!-- Right Vertical Blue Bar (shadowed depth bar on right of E) -->
    <rect x="409" y="112" width="22" height="180" rx="2" fill="url(#rightBarShade)"/>

    <!-- ==========================================
         2. ACE LETTERFORMS (HIGH VECTOR CLARITY)
         ========================================== -->
    <!-- 'A' (Pure Crisp White, aligned on left edge at x=81) -->
    <path d="M 141,120 L 169,120 L 215,260 L 183,260 L 173,224 L 123,224 L 113,260 L 81,260 Z M 130,198 L 166,198 L 155,148 L 148,148 Z" fill="#FFFFFF"/>

    <!-- 'C' (Vibrant Royal Cobalt Blue #154DF4) -->
    <path d="M 301,152 L 301,120 C 241,120 211,146 211,190 C 211,234 241,260 301,260 L 301,228 C 261,228 243,214 243,190 C 243,166 261,152 301,152 Z" fill="#154DF4"/>

    <!-- 'E' (Vibrant Royal Cobalt Blue #154DF4) -->
    <path d="M 321,120 L 393,120 L 393,148 L 353,148 L 353,176 L 385,176 L 385,204 L 353,204 L 353,232 L 393,232 L 393,260 L 321,260 Z" fill="#154DF4"/>

    <!-- ==========================================
         3. CENTERED BROTOTYPE BRAND LOCKUP
         Compact, perfectly centered at x=239 (global x=256)
         ========================================== -->
    <g transform="translate(109, 324)">
      <!-- White Container Box for 'BRO' -->
      <rect x="0" y="0" width="104" height="42" rx="3" fill="#FFFFFF"/>

      <!-- 'BRO' in solid black -->
      <text x="52" y="30" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">BRO</text>

      <!-- 'TOTYPE' in crisp white -->
      <text x="116" y="30" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">TOTYPE</text>

      <!-- 'BROTHER YOU NEVER HAD' - Spanning exactly across 260px -->
      <text x="0" y="58" font-family="'Montserrat', 'Arial', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" textLength="260" lengthAdjust="spacing">BROTHER YOU NEVER HAD</text>
    </g>
  </g>
</svg>
