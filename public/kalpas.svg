<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <!-- Gradient for Circular Target Emblem: Bright Green to Cyan to Blue -->
    <linearGradient id="kalpasGradient" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#00d26a" />
      <stop offset="45%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Circular Target Icon -->
  <g transform="translate(42, 40)">
    <!-- Outer Gradient Disc -->
    <circle cx="0" cy="0" r="36" fill="url(#kalpasGradient)" />

    <!-- Concentric Target Rings -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ffffff" stroke-width="2.6" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2.6" />

    <!-- Pencil / Rocket Arrow entering from bottom-left to center -->
    <!-- White Pencil / Arrow Shaft with fins -->
    <path d="M-36,19 L-28,9 L-22,17 L-14,3 L-4,-4 L4,-4 L-6,17 L-14,13 L-23,28 Z" fill="#ffffff" />
    
    <!-- Arrowhead Tip (Blue cone in center) -->
    <path d="M-4,-4 L0,0 L4,-4 Z" fill="#0077b6" />
  </g>

  <!-- Typography: "kalpas" with rounded friendly font geometry -->
  <g transform="translate(96, 55)">
    <text font-family="'Nunito', 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1px">
      <tspan fill="#0F0F0F">kalpa</tspan><tspan fill="#00c853">s</tspan>
    </text>
  </g>
</svg>
